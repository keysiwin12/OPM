<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Máquinas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <h2 class="mb-4">Reporte de Asesores</h2>

  <? for (var c of data) { ?>
    <div class="container mb-5">
      <h4 class="mb-3">Cliente: <span class="text-primary"><?= c.id_asesor ?></span> 
        <small class="text-muted">(<?= c.maquinas.length ?> máquinas)</small>
      </h4>
      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
          <thead class="table-dark">
            <tr>
              <th>Num. Serie</th>
              <th>Num. Interno</th>
              <th>Cliente</th>
              <th>Línea</th>
              <th>Familia</th>
              <th>Ubicación</th>
              <th>Horómetro</th>
              <th>Próx. MTO</th>
              <th>Horas Restantes</th>
              <th>Precio</th>
            </tr>
          </thead>
          <tbody>
            <? 
              let total = 0;
              for (var m of c.maquinas) {
                total += Number(m["precio_estimado"]) || 0;
            ?>
              <tr>
                <td><?= m["num_serie"] || "" ?></td>
                <td><?= m["num_interno"] || "" ?></td>
                <td><?= m["cliente"] || "" ?></td>
                <td><?= m["linea"] || "" ?></td>
                <td><?= m["familia"] || "" ?></td>
                <td>
                  <? if (m["url"] && m["url"] !== "SIN_UBICACION") { ?>
                    <a href="<?= m["url"] ?>" target="_blank">Ubicación</a>
                  <? } else { ?>
                    <span class="text-muted">no disponible</span>
                  <? } ?>
                </td>
                <td><?= Number(m["horas_trabajo_motor"]).toFixed(2) || "" ?></td>
                <td><?= m["prox_mto"] || "" ?></td>
                <td><?= Number(m["horas_restantes"]).toFixed(1) || "" ?></td>
                <td><?= Number(m["precio_estimado"]).toFixed(1) || "" ?></td>
              </tr>
            <? } ?>
          </tbody>

          <tfoot>
            <tr class="table-secondary fw-bold">
              <td colspan="9" class="text-end">TOTAL ESTIMADO</td>
              <td><?= total.toFixed(1) ?></td>
            </tr>
          </tfoot>
        </table>

      </div>
    </div>
  <? } ?>

</body>
</html>
